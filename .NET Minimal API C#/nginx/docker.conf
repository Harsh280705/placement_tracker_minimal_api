# Placement Tracker Minimal API — NGINX reverse proxy + static host (SINGLE container).
#
# Single public entry point:  http://localhost:8081
#   /        -> Vue production bundle (static files in /usr/share/nginx/html,
#               built from the same frontend sources; try_files keeps
#               vue-router history-mode routes working)
#   /api/... -> Minimal API on 127.0.0.1:5039 (URI forwarded unchanged)
#
# Port note: the controller-based app uses :8080/:5038/:5173. This Minimal API
# edition uses :8081/:5039/:5174 so both stacks can run side-by-side.

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Minimal API ----------------------------------------------------------
    # URI is forwarded unchanged: /api/applications -> /api/applications.
    location /api/ {
        proxy_pass http://127.0.0.1:5039;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Vue 3 frontend (static bundle + SPA fallback) ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
