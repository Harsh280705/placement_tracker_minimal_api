# Placement Tracker Minimal API — full stack in ONE container.
# Start:  docker compose up --build
# App:    http://localhost:8081
# Stop:   docker compose down   (no -v: keeps the pgdata_minimal_api volume)
#
# Single service `minimal-api-app` runs NGINX (:8080, public entry) + Minimal API
# (127.0.0.1:5039, internal) + PostgreSQL 16 (127.0.0.1:5432, internal) +
# the Vue production bundle (served by NGINX as static files).
# Data persists in the `pgdata_minimal_api` volume at /var/lib/postgresql/data.
#
# This container is INDEPENDENT of the controller-based app's container:
# different container name, different host port (8081 vs 8080),
# different volume (pgdata_minimal_api vs pgdata).
services:
  minimal-api-app:
    build: .
    container_name: placement-tracker-minimal-api
    ports:
      - "8081:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placement_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata_minimal_api:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/applications || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata_minimal_api:
